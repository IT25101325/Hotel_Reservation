# Server Configuration
server.port=8080

# Application Name
spring.application.name=hotel-reservation-system

# Microsoft SQL Server Configuration (SQL Server Management Studio 22)
# Note: Local SQL Server instance is listening on port 56872
spring.datasource.url=jdbc:sqlserver://localhost:56872;databaseName=hotel_reservation_db;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=Password123!

# Alternative dedicated login:
# spring.datasource.username=hotel_user
# spring.datasource.password=HotelPassword123!

# JPA / Hibernate Configuration for Microsoft SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=9a2f8c4e1b7d5a0f8e3c6b9a2f5e8d1c4b7a0f3e6d9c2b5a8f1e4d7c0b3a6f9e
app.jwt.expiration-ms=86400000

# CORS Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
